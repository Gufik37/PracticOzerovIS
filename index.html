<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Cases – Открывай кейсы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2c3e50;">
        <div class="container">
            <a class="navbar-brand" href="#">⛏️ Minecraft Cases</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">О проекте</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Контакты</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="loginLink">Войти</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="text-center mb-4">🔥 Открой кейс и получи редкий предмет!</h1>
        <div class="text-center mb-4">
            <button id="openCaseBtn" class="btn btn-success btn-lg">Открыть кейс</button>
            <button id="clearBtn" class="btn btn-warning btn-lg">Очистить историю</button>
        </div>

        <div id="resultArea" class="text-center mb-4">
            <div id="animationBox" class="p-3 border rounded bg-light" style="min-height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                Нажми "Открыть кейс"
            </div>
        </div>

        <h3>История открытий</h3>
        <ul id="historyList" class="list-group"></ul>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Minecraft Cases. Не для реальных ставок.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
