<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты – Minecraft Cases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2c3e50;">
        <div class="container">
            <a class="navbar-brand" href="#">⛏️ Minecraft Cases</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">О проекте</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Контакты</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="loginLink">Войти</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1>Контакты</h1>
        <p>Есть вопросы? Напишите нам!</p>

        <div class="card mb-4">
            <div class="card-header bg-danger text-white">Форма обратной связи (УЯЗВИМАЯ)</div>
            <div class="card-body">
                <form id="xssForm" method="GET">
                    <div class="mb-3">
                        <label for="comment" class="form-label">Ваш комментарий</label>
                        <input type="text" class="form-control" id="comment" name="comment" placeholder="Напишите что-нибудь">
                    </div>
                    <button type="submit" class="btn btn-danger">Отправить (уязвимо)</button>
                </form>
                <div id="xssOutput" class="mt-3 p-2 border bg-light"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-success text-white">Форма обратной связи (БЕЗОПАСНАЯ)</div>
            <div class="card-body">
                <form id="safeForm">
                    <div class="mb-3">
                        <label for="safeComment" class="form-label">Ваш комментарий</label>
                        <input type="text" class="form-control" id="safeComment" placeholder="Напишите что-нибудь">
                    </div>
                    <button type="button" class="btn btn-success" id="safeSubmit">Отправить (безопасно)</button>
                </form>
                <div id="safeOutput" class="mt-3 p-2 border bg-light"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">Аутентификация (имитация JWT)</div>
            <div class="card-body">
                <button class="btn btn-primary" id="loginBtn">Войти (имитация)</button>
                <button class="btn btn-secondary" id="logoutBtn">Выйти</button>
                <div id="authStatus" class="mt-2"></div>
                <div id="protectedData" class="mt-2"></div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Minecraft Cases. Не для реальных ставок.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
